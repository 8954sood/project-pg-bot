name: Voice Studio · GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/voice-reference/**'
      - 'tests/web/**'
      - '.github/workflows/voice-reference-pages.yml'
  pull_request:
    paths:
      - 'web/voice-reference/**'
      - 'tests/web/**'
      - '.github/workflows/voice-reference-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test audio processing and recording lifecycle
        run: node --test tests/web/*.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check web/voice-reference/app.mjs
          node --check web/voice-reference/recorder.mjs
          node --check web/voice-reference/audio-utils.mjs
          node --check web/voice-reference/voice-package.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/voice-reference
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
